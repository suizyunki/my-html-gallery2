<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LevelOverlay1 | 水準器×傾斜×画像 新次元クリエイティブツール</title>
  
  <!-- Google Fonts: Orbitron & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       RESET & BASE THEME
       ========================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #05070B;
      --accent-cyan: #00F0FF;
      --accent-purple: #9D00FF;
      --accent-neon: #39FF14;
      --accent-hotpink: #FF007F;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --glass-bg: rgba(14, 20, 32, 0.78);
      --glass-border: rgba(0, 240, 255, 0.28);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* サイバーグリッド＆アンビエント */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow {
      position: fixed;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(157, 0, 255, 0.08) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(90px);
    }

    /* ==========================================================
       CONTAINER & FULLPAGE SNAP
       ========================================================== */
    .container {
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      position: relative;
      z-index: 2;
    }

    .section {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 5vh 20px 3.5vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* HUD */
    .hud-header {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 40;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .hud-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      background: linear-gradient(135deg, #FFF 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .page-dots {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 40;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .dot.active {
      height: 26px;
      border-radius: 4px;
      background: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    /* ==========================================================
       CAPTION CARDS
       ========================================================== */
    .caption-box {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 14px 26px;
      max-width: 680px;
      width: 92%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), inset 0 0 16px rgba(0, 240, 255, 0.1);
      z-index: 10;
      opacity: 0;
      transform: translateY(22px);
      transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .caption-tag {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 5px;
    }

    .caption-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      background: linear-gradient(180deg, #FFFFFF 30%, #DFE7EC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .caption-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 300;
    }

    .section.is-active .caption-box {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================
       PAGE 1: 特殊演出（背景5/7/9透かし ＆ スワイプ誘導ギミック）
       ========================================================== */
    /* 背景の5.PNG, 7.PNG, 9.PNG うっすらホログラム配置 */
    .p1-bg-holograms {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .holo-img {
      position: absolute;
      object-fit: contain;
      border-radius: 18px;
      opacity: 0.18;
      filter: blur(1.5px) saturate(1.4);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
      transition: transform 0.2s ease-out;
    }

    .holo-img-5 {
      top: 14%;
      left: -8%;
      width: 44vw;
      max-width: 300px;
      transform: rotate(-14deg);
      animation: holoFloatLeft 7s ease-in-out infinite alternate;
    }

    .holo-img-7 {
      top: 22%;
      right: -8%;
      width: 46vw;
      max-width: 320px;
      transform: rotate(12deg);
      animation: holoFloatRight 8s ease-in-out infinite alternate;
    }

    .holo-img-9 {
      bottom: 6%;
      left: 28%;
      width: 42vw;
      max-width: 290px;
      transform: rotate(-5deg);
      opacity: 0.14;
      animation: holoFloatCenter 9s ease-in-out infinite alternate;
    }

    @keyframes holoFloatLeft {
      0% { transform: translateY(0) rotate(-14deg); }
      100% { transform: translateY(-16px) rotate(-11deg); }
    }
    @keyframes holoFloatRight {
      0% { transform: translateY(0) rotate(12deg); }
      100% { transform: translateY(18px) rotate(15deg); }
    }
    @keyframes holoFloatCenter {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-12px) rotate(-2deg); }
    }

    /* 第1ページの大きめテキスト＆小さめ画像 */
    #sec-1 .caption-box {
      padding: 18px 28px;
      border-color: rgba(0, 240, 255, 0.4);
    }
    #sec-1 .caption-title {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #FFFFFF 15%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #sec-1 .caption-desc {
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 4px;
    }
    #sec-1 .media-content {
      max-height: 42vh;
      max-width: 72vw;
    }

    /* 思わずスワイプしたくなる光るシェブロンギミック */
    .swipe-invitation {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 10;
      cursor: pointer;
    }

    .swipe-pill {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
      animation: pulsePill 2s infinite ease-in-out;
    }

    @keyframes pulsePill {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.7); transform: scale(1.03); }
    }

    .chevron-stream {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.6;
    }

    .chevron-arrow {
      color: var(--accent-cyan);
      font-size: 1rem;
      opacity: 0.2;
      animation: chevronFlow 1.6s infinite ease-in-out;
    }
    .chevron-arrow:nth-child(1) { animation-delay: 0s; }
    .chevron-arrow:nth-child(2) { animation-delay: 0.25s; }
    .chevron-arrow:nth-child(3) { animation-delay: 0.5s; }

    @keyframes chevronFlow {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(4px); text-shadow: 0 0 8px var(--accent-cyan); }
    }

    /* ==========================================================
       MEDIA CONTAINERS (1〜4)
       ========================================================== */
    .media-frame {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      z-index: 5;
    }

    .media-content {
      max-height: 58vh;
      max-width: 88vw;
      border-radius: 20px;
      object-fit: contain;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.8s ease;
    }

    .section.is-active .media-content {
      animation: gentleFloat 4.5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-7px); }
    }

    .next-guide {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      cursor: pointer;
      animation: pulseGuide 1.8s infinite;
      z-index: 10;
    }

    @keyframes pulseGuide {
      0%, 100% { opacity: 0.5; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(4px); }
    }

    .video-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      padding: 3px 9px;
      border-radius: 12px;
    }

    /* ==========================================================
       PAGE 5: 左から356789順に登場＆タップしても止まらない無限ストリーム
       ========================================================== */
    #sec-5 {
      padding: 4vh 0 3vh;
    }

      width: 100vw;
      overflow: hidden;
      position: relative;
      margin: 12px 0;
